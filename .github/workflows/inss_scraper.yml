name: Run INSS Scraper 24/7

on:
  schedule:
    - cron: '15 * * * *' # Runs at the 15th minute of every hour (24 times a day)
  workflow_dispatch: # Allows you to click a button to run it manually anytime

jobs:
  scrape-inss:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cat ingestion/requirements.txt | grep -v "spacy\|pydantic\|geopy\|geocoder\|deep-translator\|tenacity\|beautifulsoup4\|feedparser\|requests" > inss_reqs.txt
        echo "playwright" >> inss_reqs.txt
        pip install -r inss_reqs.txt

    - name: Install Playwright Browsers
      run: playwright install chromium

    - name: Run INSS Scraper
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: |
        python scrapers/inss/scrape_powerbi.py
