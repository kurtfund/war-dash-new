name: News & Stock Watchlist Ingestion

on:
  schedule:
    - cron: '*/30 * * * *' # Runs every 30 minutes 24/7 for free
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab
  push:
    branches:
      - main

jobs:
  ingest:
    name: Poll News, Stocks & Official Summaries
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install supabase feedparser requests python-dotenv geopy deep-translator tenacity beautifulsoup4

    - name: Run Ingestion (News RSS, Yahoo Finance Stocks, WAM MOFA)
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: |
        python ingestion/worker.py --once
